defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (perelem+other) v2 110K PER-ELEMENT + "other" channel — ChannelViT.
# ── Reads the per-element v2 tuples (data_train_plinder_v2_perelem.pt, built by
#    dataset/plinder/04_build_perelem.py): ligand atoms_channel 0..7 where 0..6 are the
#    common drug elements (C,O,N,S,F,Cl,P) and 7 is an "other" channel catching the 0.25%
#    rare tail (Br,I,B,Se,metals) — nothing dropped, S and P now SEPARATE channels (the
#    vdW-size diverse encoding could not resolve them). Pocket = C,O,N,S (0..3). Per-atom
#    vdW radius stored → real blob sizes. input_mode=atomblob_density KEEPS the 8 channels
#    (vs roleblob which sums them).
# ── Head-to-head vs roleblob-diverse-110K (rho 0.577) and per-element-vocab-17.5K (0.637):
#    isolates whether the per-element ENCODING (not the data/capacity) is the limiter.

debug: False
wandb: True
wandb_tags: [pretrain, atomblob, perelem, other, density_gradmag, 40m, plinder, otf, v2, ligvdw, mask050, uniform, cdg, channelvit, archcompare]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260629_plinder_v2_perelem_other_cdg_channelvit_mask050_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 8
accum_steps: 4
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density       # KEEP the 8 ligand + 4 pocket element channels (not role-summed)
with_gradmag: true                 # + density + gradmag → 14 channels total

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2_perelem
  data_file: pretrain/data_train_plinder_v2_perelem.pt
  normalize: false
  ligand_radius: -1                # per-atom vdW radius stored in the per-element tuple → used directly
  pocket_radius: -1
  n_lig_ch: 8                      # 8 ligand channels (7 common + 1 other) — mask keeps atoms_channel 0..7
  n_poc_ch: 4
  subset_xray_only: true
  subset_n: 112633                 # v2 110K train positions − 100 val (verify vs build log)
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 14                # 8 lig + 4 poc + density + gradmag
  n_channels_ligand: 8             # voxelizer ligand width (drives _channel_layout + voxelize)
  n_channels_pocket: 4
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: channel_group  # ChannelViT: per-group tokens + attention
  channel_groups: [8, 4, 2]        # lig(8) / poc(4) / density+gradmag(2) (sum = 14)

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50
  mask_strategy: uniform
  mask_atom_tau: 1.0
  channel_weighting: uniform
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
