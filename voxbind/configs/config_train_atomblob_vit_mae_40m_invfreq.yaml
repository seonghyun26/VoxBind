defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (a) Atom-blob ONLY (SEPARATE lig+poc) ViT-MAE — the no-density baseline.
# 11 input channels: 7 lig + 4 poc (vdW radii). No density, no gradmag.
# Same recipe as (b)/(c) on the atom side (inv_freq+clip30, atom_pos_weight=10,
# ~1M patch-MLP head). use_xray=false (no density I/O), but crops_dir is set so
# the x-ray-availability mask is found and the 78,428 subset MATCHES (b)/(c).

debug: False
wandb: True
wandb_tags: [pretrain, atomblob, 40m, invfreq, ligvdw, clip30, crossdocked_xray]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260606_atomblob_vit_mae_40m_invfreq_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

compile:
  enabled: false
  backend: inductor
  mode: reduce-overhead
  fullgraph: false
  dynamic: false

input_mode: atomblob
with_gradmag: false

dset:
  crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/pretrain/xray_crops_aligned_v5   # only for the availability mask (subset match)
  ligand_radius: -1
  subset_xray_only: true
  subset_n: 78428
  subset_val_n: 100
  use_xray: false                  # atoms only — no density loaded

model:
  n_in_channels: 11                # 7 lig + 4 poc
  head_style: patch_mlp
  head_hidden_dim: 67              # ~0.93M-param head (11-ch recon)
  head_depth: 2

mae:
  pretext_style: mae
  density_source: synthetic        # unused (atomblob has no density) — atomblob skips density entirely
  sigma_blur_a_lo: 0.30            # synthetic-blur params: unused for atomblob but read unconditionally
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.60
  mask_strategy: atom_biased
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  # NO density_channel_weight (atomblob is not a *_density mode; must stay default 1.0)
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
