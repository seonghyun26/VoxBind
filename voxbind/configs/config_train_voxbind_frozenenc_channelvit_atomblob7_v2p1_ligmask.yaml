defaults:
  - dset: crossdocked_xray          # need xray_density for the conditioning encoder
  - model: voxbind
  - vox: default
  - wjs: training
  - override hydra/job_logging: custom
  - _self_

# LEAK-REMOVAL ablation of the frozen-encoder VoxBind (Path B).
# Identical to config_train_voxbind_frozenenc_channelvit_atomblob7_v2p1.yaml EXCEPT the
# density + gradmag channels fed to the frozen encoder are BLANKED inside the clean
# ligand's footprint (density_mask_ligand=true). The mask region is derived from the
# ligand COORDINATES (occupancy of the clean ligand voxel grid, dilated 2 voxels ≈0.5Å),
# exactly the region where the ligand atoms sit — the same region the 7 ligand-atom
# channels already zero out.
#
# WHY: the v5 crop is holo x-ray density, so it contains the co-crystal LIGAND's own
# electron density. The baseline frozen-enc zeros only the ligand ATOM channels, so the
# encoder can still read the ligand through the density/gradmag channels (a leak). This
# run closes that leak: the encoder sees pocket density with a ligand-shaped hole. It
# tests whether the frozen-enc docking gain is a real POCKET signal (survives) or ligand
# density LEAKAGE (collapses toward vanilla). At eval, sample() carves the same hole from
# the reference ligand, so train/test stay consistent — no eval-script change needed.
#
# Encoder: atomblob7 v2.1 ChannelViT (PLINDER v2.1, 107k, C+D+G, groups [7,4,1,1]):
#   exps/260701_plinder_v2p1_box_atomblob7_cdg_channelvit_full_pretrain/checkpoint_e0099.pth.tar
# Only the UNet3D + density_proj fusion (zero-init) train; the encoder stays frozen.
# Baseline recipe: sig=0.9, lr=1e-5, bsz=32/rank (eff 128).

debug: False
wandb: True
wandb_tags: [voxbind, density_cond, frozen_encoder, channelvit, plinder, atomblob7, v2p1, cdg, full13_ligmasked, leak_removal, density_mask_ligand]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: voxbind_frozenenc_atomblob7_v2p1_ligmask_sig${smooth_sigma}
output_dir: null

seed: 42
num_epochs: 350
aug: True
bsz: 32                              # per-rank → eff 128 across 4 GPUs
accum_steps: 1
lr: 1e-5
wd: 1e-2
smooth_sigma: 0.9                    # baseline frozen-enc sigma — clean A/B vs the leaky σ0.9 frozen-enc

# density passed to the model as 1-ch (v5 arcsinh+z); gradmag derived in-model (Path B),
# so the dataloader stays 1-ch — keep top-level with_gradmag off.
with_gradmag: false

dset:
  # v5 density crops (arcsinh soft-squash + z-score) — MUST match the encoder's pretraining
  # distribution. normalize:false because the v5 crops are pre-normalized on disk.
  crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/xray_crops_aligned_v5
  normalize: false
  pocket_radius: -1                 # element-wise vdW pocket atoms — matches the encoder
  ligand_radius: 0.5                # generation-target representation (encoder never sees the ligand)
  use_xray: true
  subset_xray_only: true            # condition only on xray-available complexes (encoder pretraining pool)
  cache_size: 32

model:
  with_density: true
  density_encoder_type: vit
  density_freeze: true              # requires_grad=False, eval, dropout off
  density_pretrained_path: /home1/irteam/VoxBind/voxbind/exps/260701_plinder_v2p1_box_atomblob7_cdg_channelvit_full_pretrain/checkpoint_e0099.pth.tar
  # LEAK REMOVAL: blank density+gradmag in the clean ligand footprint (mask from ligand coords)
  density_mask_ligand: true
  density_mask_threshold: 0.2       # occupancy threshold on the summed clean-ligand voxel grid
  density_mask_dilate: 2            # dilate 2 voxels (0.25Å grid → 0.5Å) to cover the x-ray envelope
  density_vit:                      # MUST match the v2.1 encoder geometry
    patch: 8
    dim: 512
    depth: 12
    heads: 8
    mlp_ratio: 4
    dropout: 0.1
    n_in_channels: 13               # full-voxel conditioning (Path B): 7 lig + 4 poc + density + gradmag
    patch_embed_mode: channel_group # v2.1 is a per-group ChannelViT (NOT fused)
    channel_groups: [7, 4, 1, 1]    # lig / poc / density / gradmag

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "smooth_sigma", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "pretrained_path", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius", "grid_dim"
]
