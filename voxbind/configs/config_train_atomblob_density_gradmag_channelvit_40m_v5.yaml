defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# ChannelViT variant of (c): atom-blob (SEPARATE lig+poc) + v5 density + gradmag.
# IDENTICAL recipe/data to config_train_atomblob_density_gradmag_vit_mae_40m_invfreq_v5.yaml
# (the FUSED 13-ch baseline, probed at atomblob_density_gradmag v5 = 0.477) — the ONLY
# change is the patch embed: per-channel-GROUP tokenization (ChannelViT) instead of one
# Conv3d that fuses all channels. So this isolates "does channel-wise embedding help?".
#
# 13 input channels grouped (7,4,1,1) = 7 lig-atom / 4 poc-atom / 1 density / 1 gradmag
# ("coordinates, density, gradmag" with atoms split lig vs poc). channel_group requires
# pos_encoding=learnable (RoPE over group-tiled tokens not wired).

debug: False
wandb: True
wandb_tags: [pretrain, atomblob_density_gradmag, channelvit, g7411, 40m, invfreq, v5, ligvdw, clip30, crossdocked_xray]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: atomblob_density_gradmag_channelvit_g7411_40m_v5
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

# ── Throughput knobs (match the fused v5 baseline) ───────────────────────────
amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: false      # this box has NO C compiler → inductor fails; bf16 amp still on
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density
with_gradmag: true                 # + gradmag → 13 channels

dset:
  crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/xray_crops_aligned_v5
  normalize: false                 # v5 crops pre-normalized on disk
  ligand_radius: -1                # element-wise vdW radii (lig + poc)
  subset_xray_only: true
  subset_n: 78428
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 13                # 11 atoms + density + gradmag
  head_style: patch_mlp            # per-patch 2-layer MLP recon head (~1.0M params)
  head_hidden_dim: 67
  head_depth: 2
  # ── ChannelViT: per-channel-group patch embed ──────────────────────────────
  patch_embed_mode: channel_group
  channel_groups: [7, 4, 1, 1]     # lig-atoms / poc-atoms / density / gradmag (sum=13)
  pos_encoding: learnable          # REQUIRED for channel_group (RoPE not wired for grouped tokens)

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.60
  mask_strategy: atom_biased
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 20

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
