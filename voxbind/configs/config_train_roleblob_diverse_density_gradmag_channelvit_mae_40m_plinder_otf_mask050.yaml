defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (role-c2-DIVERSE) Phase-2 ROLE-SPLIT C+D+G — ChannelViT, DIVERSE-ATOM PLINDER.
# ── Same 4-channel role-split as the Phase-1 ChannelViT role config, but reads the
#    Phase-2 DIVERSE PLINDER tuples (data_train_plinder_diverse.pt, built by
#    03c_plinder_preprocess.py --mode diverse): every heavy atom is kept (no 7/4
#    element-vocab ceiling; noble-gas/dummy artifacts excluded) with its own vdW
#    radius stored per-atom, atoms_channel collapsed to 0 → the single role channel
#    admits ANY element by blob SIZE. Pairs with xray_resample_plinder_diverse
#    (R=I deposited-frame manifest regenerated for the diverse tuples).
# ── This is the actual "train over diverse atoms" arm; head-to-head vs the Phase-1
#    role config (which sums the 7/4-vocab channels) isolates the gain from the
#    previously-dropped diverse atoms (metals/Se/halogens in pockets + ligands).

debug: False
wandb: True
wandb_tags: [pretrain, roleblob, diverse, density_gradmag, 40m, plinder, otf, ligvdw, mask050, uniform, cdg, channelvit, rolesplit, archcompare]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260623_plinder_otf_roleblob_diverse_cdg_channelvit_mask050_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 8
accum_steps: 4
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: roleblob_density       # 2 role atom channels [ligand, pocket] + density
with_gradmag: true                 # + gradmag → 4 channels total

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/xray_resample_plinder_diverse
  data_file: data_train_plinder_diverse.pt
  normalize: false
  ligand_radius: -1                # per-atom vdW radius is stored in the diverse tuple → used directly
  pocket_radius: -1
  subset_xray_only: true
  subset_n: 17430                  # diverse build = 17530 train positions − 100 val (== the per-element arm)
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 4                 # [ligand, pocket, density, gradmag]
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: channel_group  # ← ChannelViT: per-group tokens + attention
  channel_groups: [1, 1, 1, 1]     # lig / poc / density / gradmag (sum = 4)

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50
  mask_strategy: uniform
  mask_atom_tau: 1.0
  channel_weighting: uniform
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
