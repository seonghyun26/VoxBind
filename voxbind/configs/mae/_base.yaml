# Objective base: the stable MAE pretext keys shared by every weighting variant.
# Per-variant files (invfreq/weighted/uniform) include this via `defaults: [_base, _self_]`
# and override only the channel-weighting knobs. Not a standalone choice (leading _).
pretext_style: mae
density_source: xray
sigma_blur_a_lo: 0.3
sigma_blur_a_hi: 0.8
sigma_noise: 0.0
block_size: 8
mask_ratio: 0.6
mask_strategy: atom_biased
mask_atom_tau: 1.0
# Variable mask-ratio (R2MAE): if BOTH set and max>min, each training batch draws
# r ~ U[min,max] instead of the fixed mask_ratio (train-only; val stays fixed).
# null = disabled → identical to fixed mask_ratio.
mask_ratio_min: null
mask_ratio_max: null
# Curriculum mask-ratio (easy→hard): ramp the per-epoch fixed ratio from mask_ratio_min →
# mask_ratio_max over mask_curriculum_epochs (null = num_epochs), then hold. Overrides R2MAE.
# false = off. mask_curriculum_steps: null/<2 = smooth linear; N>=2 = CurriMAE-style step
# schedule (N discrete levels, each held for ramp/N epochs; e.g. 4 → 0.6/0.7/0.8/0.9).
mask_curriculum: false
mask_curriculum_epochs: null
mask_curriculum_steps: null
# Channel-independent masking (hierarchical): when true, re-sample the spatial mask INDEPENDENTLY
# per ChannelViT group at per-group ratios (mask_group_ratios, aligned to model.channel_groups) —
# e.g. [7,4,2] with [0.6,0.6,0.85] masks density+gradmag harder than coords so the encoder must
# reconstruct density FROM structure at the same voxel. null ratios → mask_ratio for all groups.
mask_channel_independent: false
mask_group_ratios: null
density_channel_weight: 0.1
gradmag_channel_weight: 0.1
density_weight_warmup_epochs: 0
gradmag_reconstruct: true
gradmag_noise: false
atom_pos_weight: 10.0
atom_pos_thresh: 0.05
lambda_dens: 1.0
lambda_str: 1.0
struct_pos_weight: 100.0
struct_pos_thresh: 0.05
ema_decay: 0.999
grad_clip: 1.0
val_every: 1
ckpt_every: 50
