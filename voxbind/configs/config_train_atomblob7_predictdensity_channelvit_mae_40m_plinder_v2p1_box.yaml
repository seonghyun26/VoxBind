defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# ── PLINDER v2.1 — ATOMBLOB-7ch C+D+G, ChannelViT, PRECOMPUTED 96³ BOXES ─────────
# v2.1 = v2 minus complexes whose ligand has an out-of-vocab heavy atom (108,165 clean →
# 107,086 positions). 7-element ligand vocab (C/O/N/S/F/Cl/P → 0..6) — NO 8th channel.
#   7 lig + 4 poc + density + gradmag = 13 ch.  ChannelViT groups [7,4,1,1].
# Own tuples/manifest/boxes (data_train_plinder_v2p1_atomblob7.pt + xray_resample_plinder_v2p1).
# PREDICT-DENSITY: encoder sees ONLY atoms (density+gradmag groups force-masked); decoder
# reconstructs atoms+density+gradmag. vs v2.1 atomblob7 (density AS INPUT). Ablation vs the atomblob8 (full v2, 0.624): does the rare out-of-vocab atom / 8th channel help?

debug: False
wandb: True
wandb_tags: [pretrain, atomblob7, v2p1, predictdensity, density_gradmag, 40m, plinder, full, box96, cdg, channelvit, h200]
num_workers: 16
prefetch_factor: 6
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260701_plinder_v2p1_predictdens_atomblob7_cdg_channelvit_full_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density       # element atom channels + density
with_gradmag: true                 # + gradmag → trailing channel

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2p1
  box_path: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2p1/box96.dat
  data_file: pretrain/data_train_plinder_v2p1_atomblob7.pt
  normalize: false
  ligand_radius: -1
  pocket_radius: -1
  n_lig_ch: 7                      # 7-element vocab, NO "other" channel
  n_poc_ch: 4
  subset_xray_only: true
  subset_n: 106000                 # PLACEHOLDER — launcher overrides from the v2.1 manifest (n-100)
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 13                # 7 lig + 4 poc + density + gradmag
  n_channels_ligand: 7
  n_channels_pocket: 4
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: channel_group  # ChannelViT
  channel_groups: [7, 4, 1, 1]     # lig / poc / density / gradmag (sum = 13)
  force_mask_groups: [2, 3]        # density+gradmag ALWAYS masked → predicted from atoms (decoder-only targets)

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50
  mask_strategy: uniform
  mask_atom_tau: 1.0
  channel_weighting: uniform
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 5
  ckpt_every: 20

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
