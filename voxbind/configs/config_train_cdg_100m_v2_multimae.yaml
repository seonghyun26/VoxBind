defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_gradmag_multimae_100m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# ── MultiMAE at the CDG v2 champion recipe (260910) ────────────────────────────
# MultiMAE (arXiv:2204.01678) with 3 modalities (ligand / pocket / density+gradmag) on the
# same 100M ChannelViT encoder + PLINDER-v2 corpus as the 260806 CDG champion. Motivation =
# DEPLOYABILITY: MultiMAE's cross-modal completion trains the encoder to reconstruct (and
# represent) any modality from the others, so density can be dropped at real inference — the
# principled version of the density-dropout run (cf. arXiv:2509.11442, missing-modality MRI).
# compile OFF (per-modality decoders + variable-count masking → graph-breaks).

debug: False
wandb: True
wandb_tags: [pretrain, cdg, 100m, v2, multimae, 3modality, cross_modal, deployable, g742]
num_workers: 6
prefetch_factor: 2
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260910_cdg_100m_v2_multimae
output_dir: null

seed: 42
num_epochs: 50
aug: True
bsz: 4                          # 100M at 24GB; eff batch = 4 x 8 x 4 GPU = 128 (matches CDG v2)
accum_steps: 8
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: false                # per-modality decoders + variable masking → graph-breaks
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density
with_gradmag: true              # + gradmag → 13 channels

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: dataset/data/pretrain/xray_resample_plinder_v2_perelem
  data_file: pretrain/data_train_plinder_v2_perelem.pt
  normalize: false
  ligand_radius: -1
  pocket_radius: -1
  subset_xray_only: true
  subset_n: 112000              # IDENTICAL sample budget to the CDG v2 champion
  subset_val_n: 100
  use_xray: true

mae:
  method: multimae              # explicit method select (resolve_method: cfg.mae.method wins)
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8                 # MAEPrefetcher API (MultiMAE ignores its block-mask output)
  mask_ratio: 0.75              #   ″  (MultiMAE Dirichlet masking replaces this)
  mask_strategy: uniform        #   ″
  gradmag_reconstruct: true
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 5                 # dense early ckpts to catch the early peak (CDG v2 peaked e25)

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
