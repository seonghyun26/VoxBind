defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (c) Atom-blob (SEPARATE lig+poc) + v5 X-ray density + gradmag — PLAIN ViT-MAE.
# ── PLINDER OTF (on-the-fly resample-aug) C+D+G, *plain ViT* with UNIFORM 50% block
#    masking. This is the C+D+G arm of the matched coords-vs-C+D+G pair (260622):
#    identical PLINDER samples, IDENTICAL recipe — the ONLY difference vs the coords
#    config (…_invfreq_plinder_otf_mask050_coords) is the input modality
#    (input_mode=atomblob_density + with_gradmag → 13 channels vs atomblob → 11).
#    Density = v5 arcsinh+z processing, resampled from the FULL CCP4 map at the
#    augmented pose each step (DatasetCrossDockedDensity, dset.resample_dir).
#    Differs from …_invfreq_plinder_otf_p100 ONLY in the mask: 0.50 UNIFORM (random)
#    here vs 0.60 atom_biased there. 13 input channels: 7 lig + 4 poc (vdW) + density + gradmag.

debug: False
wandb: True
wandb_tags: [pretrain, atomblob_density_gradmag, 40m, invfreq, plinder, otf, ligvdw, clip30, mask050, uniform, cdg, matchedpair]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260622_plinder_otf_cdg_mask050_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

# ── Throughput knobs — amp + compile ON by default (260611; verified same results). ────
amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density
with_gradmag: true                 # + gradmag → 13 channels

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""                    # off: no frozen crops (resample_dir takes priority)
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/plinder/xray_resample_plinder   # OTF resample-aug
  data_file: data_train_plinder.pt # PLINDER ligand-matched corpus (17,530 tuples; pre-shuffled seed 1234)
  normalize: false                 # OTF path applies its own arcsinh+z (v5) recipe (resample.json)
  ligand_radius: -1                # element-wise vdW radii (lig + poc)
  subset_xray_only: true
  subset_n: 17430                  # FULL train pool = 17,530 − 100 val
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 13                # 11 atoms + density + gradmag
  head_style: patch_mlp            # per-patch 2-layer MLP recon head (~1.0M params)
  head_hidden_dim: 67
  head_depth: 2

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50                 # ← 50% masked
  mask_strategy: uniform           # ← random (uniform) block masking, NOT atom_biased
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
