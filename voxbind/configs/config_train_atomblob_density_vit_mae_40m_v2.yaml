defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# Vanilla 12-ch atomblob_density (7 lig + 4 poc + 1 density) ViT-MAE on v2
# density crops. NO weighted recipe — matches the original 260526 baseline's
# pretext (uniform block mask, equal channel weights). Only delta vs 260526:
#   dset.crops_dir → xray_crops_aligned_v2 (pocket-pool z-score; no per-crop clip)
#   dset.normalize → false (crops are already pool-z'd)
#
# Tests whether the v2 density distribution alone (without the weighted-MAE
# recipe) is enough to lift the standard 12-ch atomblob_density above its
# 0.328 v1 baseline on the PDBbind probe.

debug: False
wandb: True
wandb_tags: []
num_workers: 4
resume: null
resume_epoch: null
exp_dir: exps
exp_name: atomblob_density_vit_mae_40m_v2${hydra.job.override_dirname}
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 8
accum_steps: 10           # single-GPU; matches 5-GPU × 2-accum baseline (effective bsz 80)
lr: 1e-4
wd: 5e-2

input_mode: atomblob_density

dset:
  crops_dir: /home/shpark/prj-denovo/VoxBind/voxbind/dataset/data/xray_crops_aligned_v2
  normalize: false
  subset_xray_only: true
  subset_n: 78428
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 12

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.60
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 20

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
