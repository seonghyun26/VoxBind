defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (c2+diff) C + D + G  +  mFo-DFc(density,gradmag) — 15-channel ChannelViT ViT-MAE.
# ── Extends the winning recipe `260705_ar_cvit_100m_v2_mask075` (100M ChannelViT, PLINDER-v2,
#    mask 0.75) with a SECOND electron-density source: the mFo-DFc difference map, processed
#    identically to 2Fo-Fc (own arcsinh+z recipe, own ‖∇ρ‖). channel_groups=[7,4,2,2] treats
#    each map's (density,gradmag) as its own modality group. Only delta vs the 13-ch C+D+G
#    winner is the added diff modality (clean attribution). density_sources=2 drives the layout.
#    Reads the precomputed uint8 boxes: box116.dat (2Fo-Fc) + box116.dat (mFo-DFc, quant ±2).

debug: False
wandb: True
wandb_tags: [pretrain, atomblob_density_gradmag, 100m, invfreq, plinder, v2, otf, box, mask075, uniform, cdg, channelvit, mfodfc, diff, 15ch]
num_workers: 6
prefetch_factor: 2
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260730_cdg_mfodfc_channelvit_100m_v2_mask075
output_dir: null

seed: 42
num_epochs: 50
aug: True
bsz: 4
accum_steps: 8
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density
with_gradmag: true                 # + gradmag per source

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2_perelem
  box_path: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2_perelem/box116.dat
  # 2nd density source: mFo-DFc difference-map recipe dir (its own box116.dat + arcsinh+z norm)
  resample_dir_diff: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2_perelem_diff
  density_sources: 2               # ← 2Fo-Fc + mFo-DFc → [7,4,2,2] = 15 channels
  data_file: pretrain/data_train_plinder_v2_perelem.pt
  normalize: false
  ligand_radius: -1
  n_lig_ch: 7
  n_poc_ch: 4
  subset_xray_only: true
  subset_n: 112000
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 15                # 7 lig + 4 poc + (dens,grad)×2 sources
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: channel_group
  channel_groups: [7, 4, 2, 2]     # lig / poc / 2Fo-Fc(dens,grad) / mFo-DFc(dens,grad)  (sum=15)
  dim: 640                         # 100M ChannelViT (winning arch)
  depth: 18
  heads: 10

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.75                 # ← winning mask ratio
  mask_strategy: uniform
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  density_channel_weight: 0.1      # applied to BOTH sources' density channels
  gradmag_channel_weight: 0.1      # applied to BOTH sources' gradmag channels
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
