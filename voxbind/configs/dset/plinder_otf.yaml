# Data group: PLINDER ligand-matched X-ray density corpus with ON-THE-FLY resample augmentation.
# Density is cropped from the full CCP4 map at the augmented pose each step (single interp, no
# edge zero-fill) instead of rotating a frozen crop. resample_dir = the s3 --resample output
# ({split}_manifest.npz + resample.json); the full CCP4 maps must be retained on disk.
dset_name: crossdocked_xray
data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
data_file: data_train_plinder.pt
crops_dir: ''                  # OTF resample path → no frozen crops
ccp4_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/ccp4
resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder
ligand_radius: -1
pocket_radius: -1
use_xray: true
# gradmag-only OTF: when true, ‖∇ρ‖ (per-sample z-scored) is fed into the single density channel
# instead of the density values. Default false; the plinder_otf_gradmagonly experiment sets it true.
# (Also honored via the VOXBIND_OTF_GRADMAG_AS_DENSITY env var for back-compat.)
gradmag_as_density: false
cache_size: 32
normalize: false               # density pre-normalized in the resample recipe
subset_n: 17430                # PLINDER corpus size
subset_xray_only: true
subset_val_n: 100
