defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# ── PLINDER v2 FULL — role-split DIVERSE C+D+G, ChannelViT, OTF ────────────────
# Full max-coverage PLINDER v2 set (113,976 selected → ~112,732 OTF train positions),
# built by dataset/plinder/04_build.py. 4 channels [ligand, pocket, density, gradmag];
# every heavy atom kept (per-atom vdW radius, atoms_channel collapsed → role admits any
# element by blob size). Pure OTF: density cropped from the FULL ccp4 map at the augmented
# pose each step (reads SHARED dataset/data/ccp4). Probe downstream on lp_edrscc_v2.
#
# Tuned for the local 4×H200 (143GB) + 128-core / 2TB box:
#   bsz 16 (2× the prior bsz-8 ChannelViT default; chain may probe higher) · accum 1
#   num_workers 24/rank (×4=96, leaves headroom) · prefetch 6 — OTF is loader-bound, so
#   workers are the real GPU-util lever (density-MAE util ceiling is data-loading, not bsz).

debug: False
wandb: True
wandb_tags: [pretrain, roleblob, diverse, density_gradmag, 40m, plinder, v2, full, otf, ligvdw, mask050, cdg, channelvit, h200]
num_workers: 24
prefetch_factor: 6
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260627_plinder_v2_otf_roleblob_diverse_cdg_channelvit_full_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 16
accum_steps: 1
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: roleblob_density       # 2 role atom channels [ligand, pocket] + density
with_gradmag: true                 # + gradmag → 4 channels total

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder_v2
  data_file: pretrain/data_train_plinder_v2.pt     # joined with data_dir → .../pretrain/data_train_plinder_v2.pt
  normalize: false
  ligand_radius: -1                # per-atom vdW radius stored in the diverse tuple → used directly
  pocket_radius: -1
  subset_xray_only: true
  subset_n: 112000                 # PLACEHOLDER — launcher overrides from the built manifest (n-100)
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 4                 # [ligand, pocket, density, gradmag]
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: channel_group  # ← ChannelViT: per-group tokens + attention
  channel_groups: [1, 1, 1, 1]     # lig / poc / density / gradmag (sum = 4)

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50
  mask_strategy: uniform
  mask_atom_tau: 1.0
  channel_weighting: uniform
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 20

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
