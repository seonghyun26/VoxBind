defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# (role-c1) ROLE-SPLIT C+D+G — plain (fused) ViT-MAE.
# ── Same 4-channel role-split input as the ChannelViT role arm
#    ([ligand-occupancy, pocket-occupancy, density, gradmag], n_in=4) but with the
#    default fused patch embed (one Conv3d mixes all 4 channels). This is the
#    plain-ViT control for the role-split representation, head-to-head with:
#      - the ChannelViT role arm ([1,1,1,1] groups), and
#      - the per-element plain-ViT C+D+G arm (13ch fused).
#    Role channel = sum of per-element voxels (identical to single-channel voxelize
#    to float epsilon); ligand_radius=-1/pocket_radius=-1 → vdW-diameter blobs, so
#    atom identity is carried by blob SIZE, not a one-hot element channel.

debug: False
wandb: True
wandb_tags: [pretrain, roleblob, density_gradmag, 40m, plinder, otf, ligvdw, mask050, uniform, cdg, vit, rolesplit, archcompare]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260623_plinder_otf_roleblob_cdg_vit_mask050_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: roleblob_density       # 2 role atom channels [ligand, pocket] + density
with_gradmag: true                 # + gradmag → 4 channels total

dset:
  data_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}
  crops_dir: ""
  resample_dir: ${oc.env:VOXBIND_DATA_ROOT,dataset/data}/pretrain/xray_resample_plinder
  data_file: data_train_plinder.pt
  normalize: false
  ligand_radius: -1                # element-wise vdW radius → blob size encodes atom identity
  pocket_radius: -1
  subset_xray_only: true
  subset_n: 17430                  # IDENTICAL samples to the per-element C+D+G arms
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 4                 # [ligand, pocket, density, gradmag]
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2
  patch_embed_mode: fused          # ← plain ViT: one Conv3d mixes all 4 channels
  channel_groups: null

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.50                 # ← 50% masked
  mask_strategy: uniform           # ← random (uniform) block masking
  mask_atom_tau: 1.0
  channel_weighting: uniform       # ← 2 role channels; inv_freq (per-element) N/A here
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
