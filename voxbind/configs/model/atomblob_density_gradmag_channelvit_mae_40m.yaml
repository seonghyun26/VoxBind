# Model group option: ~45.4M ChannelViT-MAE, 13-channel input with per-group patch tokenization.
# Identical transformer backbone to atomblob_density_gradmag_vit_mae_40m (dim=512, depth=12,
# heads=8) but uses ChannelViT-style grouped patch embed: separate Conv3d per channel-group so
# each group gets its own token-set (+learnable group embedding, shared spatial PE). Attention
# spans all nG·N = 4·512 = 2048 tokens — groups can attend across each other.
# Output: mean-pool over groups → same (B, c_out, G, G, G) interface as the fused ViT.
model_name: atomblob_density_gradmag_channelvit_mae_40m
n_channels: 32
patch_size: 8
# Input composition lives WITH the model (P1b/#2).
input_mode: atomblob_density
with_gradmag: true
n_in_channels: 13       # 11 atom-type (7 lig + 4 poc) + 1 density + 1 gradmag
dim: 512
depth: 12
heads: 8
mlp_ratio: 4
dropout: 0.1
pos_encoding: learnable
rope_fast: false
n_struct_channels: 0    # disabled: atoms ARE part of the input
dual_head: false
head_hidden_dim: 67     # per-patch 2-layer MLP recon head (~1.0M params)
head_depth: 2
patch_embed_mode: channel_group
channel_groups: [7, 4, 1, 1]   # lig atoms / poc atoms / density / gradmag (sum = 13)
head_style: patch_mlp
