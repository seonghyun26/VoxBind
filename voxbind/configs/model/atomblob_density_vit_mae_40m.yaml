model_name: atomblob_density_vit_mae_40m
# ~45.4M-param ViT. Same width/depth as density_vit_mae_40m but the patch
# embed accepts 12 channels: 7 ligand + 4 pocket atom-type + 1 z-scored
# X-ray density. The structure aux head is disabled (n_struct_channels=0)
# because the atom voxels are already part of the input — see comment in
# atomblob_vit_mae_40m.yaml.
#
# Param delta vs density_vit_mae_40m (~42.6M):
#   patch_embed (1→512 → 12→512, k=8 s=8) : +2,883,584
#   head_density (c_half→1 → c_half→12, k=3) :   +4,762
#   head_structure                          :  -11,707  (removed)
#   net                                     : +2,876,639  → ~45.4M total
n_channels: 32
patch_size: 8
n_in_channels: 12       # 11 atom-type (7 lig + 4 poc) + 1 X-ray density
dim: 512
depth: 12
heads: 8
mlp_ratio: 4
dropout: 0.1
pos_encoding: learnable # learnable (additive abs table) | rope3d (axial 3D RoPE, Primus arXiv:2503.01835)
rope_fast: false        # rope3d only: fused q/k rotate, fewer temporaries (numerically identical)
n_struct_channels: 0    # disabled: atoms ARE part of the input

# ── MAE head knobs (no-op defaults — override per run) ─────────────────────────
dual_head: false        # true → split atom vs density branches in the recon head
head_hidden_dim: 0      # 0 → defaults to c_half (= n_channels // 2 = 16)
head_depth: 2           # # of Conv3d layers in each head (>=1); 2 = current

# ── ChannelViT patch embed (no-op default = fused) ─────────────────────────────
patch_embed_mode: fused # fused (1 Conv mixes all channels) | channel_group (per-group tokens + attention)
channel_groups: null    # channel_group only: per-group channel counts (must sum to n_in); e.g. [7,4,1,1]
                        # for 13ch = 7 lig-atom + 4 poc-atom + 1 density + 1 gradmag
channel_group_dropout: 0.0  # ChannelViT HCS: per-forward prob of dropping each whole group (train-only,
                            # ≥1 kept). 0.0 = off (no-op). channel_group mode only.
