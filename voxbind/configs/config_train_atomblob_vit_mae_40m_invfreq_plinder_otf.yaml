defaults:
  - dset: crossdocked_xray
  - model: atomblob_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# ── C (atom-only) 40M ViT-MAE on PLINDER — the no-density baseline paired with C+D+G ──
# Pairs with config_train_atomblob_density_gradmag_vit_mae_40m_invfreq_plinder_otf (13ch). Identical
# 40M ViT, identical PLINDER tuples (data_train_plinder.pt) + identical shuffle(1234)->drop100->filter
# laydown => SAME 20,286 train / 100 val; the ONLY difference is input channels (11ch = 7 lig + 4 poc,
# NO density / NO gradmag) — isolates whether density+gradmag in pretraining helps the LP-PDBBind probe.
# Atoms voxelize on-GPU with ON-THE-FLY rot+trans augmentation (aug=True); no density resample
# (no resample_dir) => light atom loader. THIS-BOX-SAFE: amp+compile OFF (no C compiler -> fp32 eager).

debug: False
wandb: True
wandb_tags: [pretrain, atomblob, coords_only, 40m, invfreq, plinder, otf_aug, ligvdw, clip30]
num_workers: 28
prefetch_factor: 16
resume: null
resume_epoch: null
exp_dir: exps
exp_name: 260620_plinder_c_invfreq_p100_pretrain
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

# ── No C compiler on this box → torch.compile crashes; fp32 eager (matches the C+D+G plinder run). ──
amp:
  enabled: false
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: false
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob
with_gradmag: false

dset:
  # Atom-only on PLINDER: NO resample_dir → DatasetCrossDockedXray (light atom path), use_xray=false.
  # crops_dir kept ONLY for the xray-availability mask so the 20,286 subset matches C+D+G exactly.
  data_file: data_train_plinder.pt
  crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/xray_crops_aligned_plinder
  ligand_radius: -1                # element-wise vdW radii (lig + poc)
  subset_xray_only: true
  subset_n: null                   # null = full PLINDER train pool (p100) → 20,286 (matches C+D+G)
  subset_val_n: 100
  use_xray: false                  # atoms only — no density I/O

model:
  n_in_channels: 11                # 7 lig + 4 poc
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2

mae:
  pretext_style: mae
  density_source: synthetic        # unused (atomblob has no density) — atomblob skips density entirely
  sigma_blur_a_lo: 0.30            # synthetic-blur params: unused for atomblob but read unconditionally
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.60
  mask_strategy: atom_biased
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  # NO density_channel_weight (atomblob is not a *_density mode; must stay default 1.0)
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 50

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
