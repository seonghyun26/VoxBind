defaults:
  - dset: crossdocked_xray
  - model: atomblob_density_vit_mae_40m
  - vox: default
  - override hydra/job_logging: custom
  - _self_

# COMBINED-DATA pretrain: atoms + REAL density + gradmag, on CrossDocked (78,428)
# + PDBbind train-split experimental density (~2,703). Identical recipe to
# config_train_atomblob_density_gradmag_vit_mae_40m_invfreq_v5.yaml (CrossDocked-only,
# probed 0.477) EXCEPT the training set also includes PDBbind experimental 2Fo-Fc
# density complexes (same v5-normalized space). Tests whether MORE / more-diverse
# experimental density data improves the density-conditioned encoder.
#
# Leakage: PDBbind probe val/test pids are EXCLUDED from the PDBbind train pool
# (guard in dataset/00g_make_pdbbind_pretrain.py). MISATO skipped (QM density,
# different modality). Val/sampling stay CrossDocked-only.

debug: False
wandb: True
wandb_tags: [pretrain, atomblob_density_gradmag, combined, crossdocked, pdbbind, 40m, invfreq, v5, ligvdw, clip30]
num_workers: 16
prefetch_factor: 8
resume: null
resume_epoch: null
exp_dir: exps
exp_name: atomblob_density_gradmag_combined_cdpdb_v5
output_dir: null

seed: 42
num_epochs: 100
aug: True
bsz: 32
accum_steps: 1
lr: 1e-4
wd: 5e-2

# bf16 amp ON (no C compiler needed); torch.compile OFF (no C compiler on box).
amp:
  enabled: true
  dtype: bf16
channels_last: false
optimizer:
  fused: false
ema:
  foreach: false
compile:
  enabled: false
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

input_mode: atomblob_density
with_gradmag: true                 # + gradmag (derived from density) → 13 channels

dset:
  dset_name: crossdocked_xray_pdbbind            # ConcatDataset(CrossDocked, PDBbind) for TRAIN
  crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/xray_crops_aligned_v5   # CrossDocked source
  pdbbind_data_dir: /home1/irteam/VoxBind/voxbind/dataset/data/pdbbind_pretrain
  pdbbind_crops_dir: /home1/irteam/VoxBind/voxbind/dataset/data/pdbbind_pretrain/crops_v5
  normalize: false                 # both sources are v5 arcsinh+z (pre-normalized)
  ligand_radius: -1                # element-wise vdW radii (lig + poc) — both sources
  subset_xray_only: true           # CrossDocked: keep the xray-available subset
  subset_n: 78428
  subset_val_n: 100
  use_xray: true

model:
  n_in_channels: 13                # 11 atoms + density + gradmag
  head_style: patch_mlp
  head_hidden_dim: 67
  head_depth: 2

mae:
  pretext_style: mae
  density_source: xray
  sigma_blur_a_lo: 0.30
  sigma_blur_a_hi: 0.80
  sigma_noise: 0.0
  block_size: 8
  mask_ratio: 0.60
  mask_strategy: atom_biased
  mask_atom_tau: 1.0
  channel_weighting: inv_freq
  channel_weight_clip_ratio: 30.0
  density_channel_weight: 0.1
  gradmag_channel_weight: 0.1
  gradmag_reconstruct: true
  gradmag_noise: false
  atom_pos_weight: 10.0
  atom_pos_thresh: 0.05
  lambda_dens: 1.0
  lambda_str: 1.0
  struct_pos_weight: 100.0
  struct_pos_thresh: 0.05
  ema_decay: 0.999
  grad_clip: 1.0
  val_every: 1
  ckpt_every: 20

hydra:
  run:
    dir: ./${exp_dir}/${exp_name}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: [
            "exp_dir", "lr", vox.grid_dim, "wd", "resume", "resume_epoch", "wandb",
            "num_workers", "exp_name", "output_dir", "out_dir",
            "bsz", "accum_steps", "seed", "num_epochs", "aug", "pocket_radius",
            "grid_dim", "debug"
]
