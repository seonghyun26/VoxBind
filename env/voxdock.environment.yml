# voxdock — paper-faithful AutoDock Vina 1.2.2 docking env (Python 3.8).
# conda-lock INPUT spec. Lock with:
#   conda-lock lock -f env/voxdock.environment.yml -p linux-64 --lockfile env/voxdock.conda-lock.yml
name: voxdock
channels:
  - conda-forge
dependencies:
  - python=3.8.16
  - numpy=1.24.3
  - scipy=1.10.1
  - rdkit=2022.03.2
  - openbabel=3.1.1
  - easydict
  - pip
  - pip:
      - vina==1.2.2
      - meeko==0.1.dev3
      - pdb2pqr==3.6.1
      - propka==3.5.0
      - mmcif-pdbx==2.0.1
      - docutils==0.17.1
      - AutoDockTools_py3 @ git+https://github.com/Valdes-Tresanco-MS/AutoDockTools_py3.git@aee55d50d5bdcfdbcd80220499df8cde2a8f4b2a
