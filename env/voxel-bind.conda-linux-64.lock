# voxel-bind env — conda layer lock (byte-exact, no solver).
# Build order (the pip layer needs the gcc that THIS file installs):
#   conda create -p $HOME/.conda/envs/voxel-bind --file env/voxel-bind.conda-linux-64.lock
#   conda run -n voxel-bind pip install -r env/voxel-bind.pip.lock.txt      # CC must point at the env's gcc
#   conda run -n voxel-bind pip install --no-deps posecheck==1.3.1          # see the pip lock header
#   conda run -n voxel-bind pip install -e .                                # VoxBind, editable
# Or just: bash script/00_setup_env.sh voxel-bind
#
# Captured from the live env on the 4xH200 box, 2026-09-14. The heavy pipeline
# stack (torch/rdkit/scipy) is pip here, not conda -- this file is the interpreter,
# openbabel, the jupyter kernel, the conda-forge gcc toolchain that builds
# cpdb-protein (this box has no system compiler), and two things FuncBind needs:
#
#   numpy 2.4.6 + openblas  conda-owned ON PURPOSE. A conda numpy arrived here once as a
#     dependency and silently replaced the pip numpy 2.4.6 with 2.5.3 while pip's metadata
#     still read 2.4.6. numpy is therefore pinned in this file and kept OUT of the pip lock
#     so exactly one tool owns it. Do not `pip install numpy` into this env.
#
# PyRosetta is deliberately ABSENT (removed 2026-09-14, -4.2 GB). FuncBind reaches it only
# through metrics_ab -> utils_rosetta.interface_energy, i.e. the antibody metrics, and that
# import is lazy now, so MCP/CrossDocked work never touches it. For antibody runs add it back:
#   mamba install -p $HOME/.conda/envs/voxel-bind -c https://conda.graylab.jhu.edu pyrosetta
# (py312 builds exist there; the wheel host graylab.jhu.edu is unreachable from this box.
#  COMMERCIAL USE REQUIRES A LICENCE.)
# platform: linux-64
# created-by: conda 25.1.1
